<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002147" />
      <stop offset="100%" stop-color="#001126" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Circular background badge with Oxford Blue & Gold border -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#shieldBorder)" stroke-width="2" />
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#FDE047" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.6" />

  <!-- Scales of Justice (Premium Law Emblem) -->
  <g filter="url(#shadow)" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Finial / Central ornament -->
    <circle cx="32" cy="14" r="1.75" fill="url(#goldGrad)" stroke="none" />
    <path d="M32 15.75 L32 46" stroke-width="2.2" />

    <!-- Pillar / Base -->
    <path d="M23 46 L41 46" stroke-width="2.5" />
    <path d="M26 49 L38 49" stroke-width="2" />

    <!-- Crossbeam (Scales bar) -->
    <path d="M17 22 L47 22" stroke-width="2.2" />
    <circle cx="32" cy="22" r="1.5" fill="#001733" stroke-width="1.5" />
    <circle cx="17" cy="22" r="1.2" fill="url(#goldGrad)" stroke="none" />
    <circle cx="47" cy="22" r="1.2" fill="url(#goldGrad)" stroke="none" />

    <!-- Left Scale Pan & Strings -->
    <path d="M17 22 L11.5 32 M17 22 L22.5 32" stroke-width="1.2" />
    <path d="M10 32 Q17 38 24 32 Z" fill="url(#goldGrad)" stroke-width="1" />

    <!-- Right Scale Pan & Strings -->
    <path d="M47 22 L41.5 32 M47 22 L52.5 32" stroke-width="1.2" />
    <path d="M40 32 Q47 38 54 32 Z" fill="url(#goldGrad)" stroke-width="1" />
  </g>
</svg>